name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          libtool \
          libltdl-dev \
          automake \
          autoconf \
          m4 \
          libffi-dev \
          libssl-dev \
          zlib1g-dev \
          pkg-config

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer cython==0.29.33

    - name: Build with Buildozer
      run: |
        unset ANDROID_NDK_HOME
        unset ANDROID_NDK
        buildozer android debug 2>&1 | tee buildozer.log

    - name: Upload Build Logs (On Failure or Success)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: buildozer-full-logs
        path: buildozer.log

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
